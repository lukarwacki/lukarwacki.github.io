{{ define "main" }}
    {{ .Content }}
  <div class="time-list">
        <ul>
            {{ range where .Site.RegularPages "Section" "posts" }}
            <li>
                <span>{{- partial "date" .Date -}}</span>
                <div><a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a></div>
            </li>
            {{ end }}
        </ul>
    </div>
{{ end }}
